name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Android project
        run: pnpm exec expo prebuild --platform android

      - name: Build optimized ARM64 release APK
        working-directory: android
        run: >-
          ./gradlew app:assembleRelease --no-daemon
          -PreactNativeArchitectures=arm64-v8a
          -Pandroid.enableMinifyInReleaseBuilds=true
          -Pandroid.enableShrinkResourcesInReleaseBuilds=true

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/release/app-release.apk liftmaxxing.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: liftmaxxing-android
          path: liftmaxxing.apk
          retention-days: 7
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" liftmaxxing.apk --generate-notes --title "Liftmaxxing $GITHUB_REF_NAME"
